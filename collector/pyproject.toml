[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcmon"
version = "0.1.0"
description = "Collector, PostgreSQL storage and REST API for envmond data-centre environment monitors."
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["dcmon*"]

[tool.setuptools.package-data]
dcmon = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
