name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: C daemon (build, tests, sanitizers, valgrind, fuzzing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y valgrind clang
      - name: Build with -Wall -Wextra -Werror
        run: make -C daemon
      - name: Unit tests
        run: make -C daemon test
      - name: Valgrind (no leaks, no invalid accesses)
        run: make -C daemon valgrind
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make -C daemon asan
      - name: Fuzz parsers (ASan + UBSan)
        run: make -C daemon fuzz-lite FUZZ_ITERATIONS=3000000

  system:
    name: Collector, API and end-to-end with PostgreSQL
    runs-on: ubuntu-24.04
    needs: daemon
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DCMON_TEST_DSN_BASE: postgresql://postgres:postgres@localhost:5432/
      DCMON_DSN_BASE: postgresql://postgres:postgres@localhost:5432/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build daemon
        run: make -C daemon
      - name: Install collector
        run: pip install -e "collector[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (unit, protocol, end-to-end with the C daemon)
        run: cd collector && pytest -q
      - name: Evaluation smoke run (one simulated day, with collector kills)
        run: python sim/evaluate.py --seeds 5 --days 1 --out smoke-results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results/
